<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#2b2550"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#a29bfe" opacity="0.12"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .px { animation: pop 3.2s ease-in-out infinite; }
      @keyframes pop { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="18" fill="url(#dots)"/>

  <!-- fenêtre de terminal -->
  <circle cx="40" cy="36" r="7" fill="#ff6b6b"/>
  <circle cx="64" cy="36" r="7" fill="#fdcb6e"/>
  <circle cx="88" cy="36" r="7" fill="#00cec9"/>

  <text x="72" y="128" class="mono" font-size="22" fill="#00cec9">choppedonion@github:~$ <tspan fill="#e6e6f0">whoami</tspan></text>
  <text x="70" y="196" class="mono" font-size="60" font-weight="700" fill="#ffffff">Youness</text>
  <text x="72" y="244" class="mono" font-size="24" fill="#a29bfe">Développeur full-stack <tspan fill="#ff6b6b">·</tspan> build &amp; ship</text>
  <rect x="72" y="266" width="14" height="26" fill="#00cec9" class="cursor"/>

  <!-- grille de pixels façon contributions -->
  <g transform="translate(900 70)">
    <rect x="0"   y="0"   width="26" height="26" rx="4" fill="#ff6b6b" class="px" style="animation-delay:0s"/>
    <rect x="34"  y="0"   width="26" height="26" rx="4" fill="#a29bfe" opacity=".35"/>
    <rect x="68"  y="0"   width="26" height="26" rx="4" fill="#00cec9" class="px" style="animation-delay:.4s"/>
    <rect x="102" y="0"   width="26" height="26" rx="4" fill="#a29bfe" opacity=".2"/>
    <rect x="136" y="0"   width="26" height="26" rx="4" fill="#ff6b6b" class="px" style="animation-delay:1.2s"/>
    <rect x="170" y="0"   width="26" height="26" rx="4" fill="#a29bfe" opacity=".5"/>
    <rect x="204" y="0"   width="26" height="26" rx="4" fill="#00cec9" opacity=".3"/>
    <rect x="238" y="0"   width="26" height="26" rx="4" fill="#a29bfe" class="px" style="animation-delay:2s"/>
    <rect x="272" y="0"   width="26" height="26" rx="4" fill="#ff6b6b" opacity=".25"/>
    <rect x="306" y="0"   width="26" height="26" rx="4" fill="#00cec9" class="px" style="animation-delay:.8s"/>

    <rect x="0"   y="34"  width="26" height="26" rx="4" fill="#a29bfe" opacity=".2"/>
    <rect x="34"  y="34"  width="26" height="26" rx="4" fill="#00cec9" class="px" style="animation-delay:1.6s"/>
    <rect x="68"  y="34"  width="26" height="26" rx="4" fill="#a29bfe" opacity=".45"/>
    <rect x="102" y="34"  width="26" height="26" rx="4" fill="#ff6b6b" class="px" style="animation-delay:2.4s"/>
    <rect x="136" y="34"  width="26" height="26" rx="4" fill="#a29bfe" opacity=".25"/>
    <rect x="170" y="34"  width="26" height="26" rx="4" fill="#00cec9" class="px" style="animation-delay:.2s"/>
    <rect x="204" y="34"  width="26" height="26" rx="4" fill="#ff6b6b" opacity=".4"/>
    <rect x="238" y="34"  width="26" height="26" rx="4" fill="#a29bfe" opacity=".2"/>
    <rect x="272" y="34"  width="26" height="26" rx="4" fill="#00cec9" class="px" style="animation-delay:2.8s"/>
    <rect x="306" y="34"  width="26" height="26" rx="4" fill="#a29bfe" opacity=".35"/>

    <rect x="0"   y="68"  width="26" height="26" rx="4" fill="#00cec9" opacity=".3"/>
    <rect x="34"  y="68"  width="26" height="26" rx="4" fill="#a29bfe" opacity=".2"/>
    <rect x="68"  y="68"  width="26" height="26" rx="4" fill="#ff6b6b" class="px" style="animation-delay:1s"/>
    <rect x="102" y="68"  width="26" height="26" rx="4" fill="#a29bfe" opacity=".45"/>
    <rect x="136" y="68"  width="26" height="26" rx="4" fill="#00cec9" class="px" style="animation-delay:2.2s"/>
    <rect x="170" y="68"  width="26" height="26" rx="4" fill="#a29bfe" opacity=".2"/>
    <rect x="204" y="68"  width="26" height="26" rx="4" fill="#a29bfe" class="px" style="animation-delay:.6s"/>
    <rect x="238" y="68"  width="26" height="26" rx="4" fill="#ff6b6b" opacity=".3"/>
    <rect x="272" y="68"  width="26" height="26" rx="4" fill="#a29bfe" opacity=".5"/>
    <rect x="306" y="68"  width="26" height="26" rx="4" fill="#ff6b6b" class="px" style="animation-delay:1.8s"/>

    <rect x="0"   y="102" width="26" height="26" rx="4" fill="#ff6b6b" opacity=".3"/>
    <rect x="34"  y="102" width="26" height="26" rx="4" fill="#a29bfe" class="px" style="animation-delay:2.6s"/>
    <rect x="68"  y="102" width="26" height="26" rx="4" fill="#a29bfe" opacity=".2"/>
    <rect x="102" y="102" width="26" height="26" rx="4" fill="#00cec9" opacity=".4"/>
    <rect x="136" y="102" width="26" height="26" rx="4" fill="#a29bfe" opacity=".25"/>
    <rect x="170" y="102" width="26" height="26" rx="4" fill="#ff6b6b" class="px" style="animation-delay:1.4s"/>
    <rect x="204" y="102" width="26" height="26" rx="4" fill="#a29bfe" opacity=".35"/>
    <rect x="238" y="102" width="26" height="26" rx="4" fill="#00cec9" class="px" style="animation-delay:.3s"/>
    <rect x="272" y="102" width="26" height="26" rx="4" fill="#a29bfe" opacity=".2"/>
    <rect x="306" y="102" width="26" height="26" rx="4" fill="#00cec9" opacity=".45"/>

    <text x="0" y="170" class="mono" font-size="16" fill="#a29bfe" opacity=".8">// build · ship · repeat</text>
  </g>
</svg>
